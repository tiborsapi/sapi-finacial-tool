name: Project CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finance_db
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The API integration tests (#[ignore]d locally) create a throwaway database each.
      DATABASE_URL: postgres://finance:finance_dev_password@localhost:5432/finance_db
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check formatting
        run: cargo fmt --manifest-path backend/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run backend tests (unit and PostgreSQL-backed API tests)
        run: cargo test --manifest-path backend/Cargo.toml --all-targets -- --include-ignored

      - name: Build release backend
        run: cargo build --manifest-path backend/Cargo.toml --release

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  database-integration:
    name: PostgreSQL BDD tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finance_db
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_TEST_DATABASE_URL: postgres://finance:finance_dev_password@localhost:5432/finance_db
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: db-integration/package-lock.json

      - name: Install database test dependencies
        working-directory: db-integration
        run: npm ci

      - name: Apply the project database migrations
        working-directory: db-integration
        run: |
          node <<'NODE'
          const { readdir, readFile } = require('node:fs/promises');
          const { Client } = require('pg');

          async function main() {
            const client = new Client({ connectionString: process.env.DB_TEST_DATABASE_URL });
            await client.connect();
            try {
              const directory = '../backend/migrations';
              const scripts = (await readdir(directory)).filter((name) => name.endsWith('.sql')).sort();
              for (const script of scripts) {
                await client.query(await readFile(`${directory}/${script}`, 'utf8'));
              }
            } finally {
              await client.end();
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Run database integration scenarios
        working-directory: db-integration
        run: npm test

  end-to-end:
    name: Browser E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Build and start the application
        run: docker compose up --build --detach

      - name: Wait for the application to be ready
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent http://localhost:8081/health > /dev/null \
              && curl --fail --silent http://localhost:8081/ > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Run browser E2E scenarios
        working-directory: e2e
        run: npm test

      - name: Show application logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the application stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  performance-smoke:
    name: Performance smoke test
    uses: ./.github/workflows/performance.yml
    with:
      rows: "10000"
      p95_ms: "100"
      iterations: "50"
